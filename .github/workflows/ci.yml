name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The e2e tests spawn the treehouse binary; suppress its self-update checks.
  TREEHOUSE_NO_UPDATE_CHECK: 1

jobs:
  format-lint:
    name: fmt + clippy (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins stable + rustfmt/clippy.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fmt check
        run: cargo fmt --all -- --check
      # Clippy scoped to default features (the toon git dep is feature-gated so
      # a checkout without network to toon_rust still lints cleanly).
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build workspace
        run: cargo build --workspace
      - name: build release binary
        run: cargo build --release --bin treehouse

  test:
    name: test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build the binary the e2e harness spawns BEFORE running tests.
      - name: build treehouse binary
        run: cargo build --bin treehouse
      - name: test workspace
        run: cargo test --workspace
      - name: test with hardening feature
        run: cargo test -p treehouse-core --features hardening
