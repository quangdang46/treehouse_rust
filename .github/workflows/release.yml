name: Release

# Trigger on version tags: vX.Y.Z (release-curl convention).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            suffix: linux-x86_64
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            suffix: linux-aarch64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            suffix: macos-x86_64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            suffix: macos-aarch64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x86_64
            use_cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross (Linux musl targets)
        if: matrix.use_cross
        shell: bash
        run: |
          # Install `cross` from its prebuilt static binary release. `cargo
          # install cross` compiles the wrapper from source (slow) and the
          # binary often lands outside PATH inside the runner's CARGO_HOME.
          set -euo pipefail
          CROSS_VERSION="v0.2.5"
          curl -fsSL "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cross.tgz
          mkdir -p /tmp/cross-extract
          tar -xzf /tmp/cross.tgz -C /tmp/cross-extract
          cross_bin=$(find /tmp/cross-extract -type f -name cross -perm -111 | head -1)
          if [ -z "$cross_bin" ]; then
            echo "::error::cross binary not found after extraction. Tarball contents:";
            find /tmp/cross-extract -type f;
            exit 1;
          fi
          sudo install -m 0755 "$cross_bin" /usr/local/bin/cross
          # NOTE: do NOT also install a `cargo-cross` alias — `cargo cross`
          # would re-execute this same binary in subcommand mode and infinitely
          # recurse. We always call `cross build` directly (not `cargo cross`).
          cross --version
      - name: Build binary
        shell: bash
        run: |
          BIN_NAME="treehouse"
          case "${{ matrix.suffix }}" in
            windows-*) BIN_NAME="treehouse.exe" ;;
          esac
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target "${{ matrix.target }}" --bin treehouse
            BIN="target/${{ matrix.target }}/release/${BIN_NAME}"
          else
            cargo build --release --bin treehouse
            BIN="target/release/${BIN_NAME}"
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "BIN_NAME=$BIN_NAME" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-$(git describe --tags --abbrev=0)}"
          # sha256sum exists on Linux; macOS/BSD uses shasum -a 256.
          sha256() { sha256sum "$1" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$1" | awk '{print $1}'; }
          case "$BIN_NAME" in
            *.exe)
              7z a "treehouse-${TAG}-${{ matrix.suffix }}.zip" "$BIN"
              printf '%s  %s\n' "$(sha256 "treehouse-${TAG}-${{ matrix.suffix }}.zip")" "treehouse-${TAG}-${{ matrix.suffix }}.zip" > "treehouse-${TAG}-${{ matrix.suffix }}.sha256"
              ls -la "treehouse-${TAG}-${{ matrix.suffix }}.zip" "treehouse-${TAG}-${{ matrix.suffix }}.sha256"
              ;;
            *)
              tar -czf "treehouse-${TAG}-${{ matrix.suffix }}.tar.gz" -C "$(dirname "$BIN")" "$BIN_NAME"
              printf '%s  %s\n' "$(sha256 "treehouse-${TAG}-${{ matrix.suffix }}.tar.gz")" "treehouse-${TAG}-${{ matrix.suffix }}.tar.gz" > "treehouse-${TAG}-${{ matrix.suffix }}.sha256"
              ls -la "treehouse-${TAG}-${{ matrix.suffix }}.tar.gz" "treehouse-${TAG}-${{ matrix.suffix }}.sha256"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: treehouse-${{ matrix.suffix }}
          path: |
            treehouse-*${{ matrix.suffix }}.tar.gz
            treehouse-*${{ matrix.suffix }}.sha256
            treehouse-*${{ matrix.suffix }}.zip
            treehouse-*${{ matrix.suffix }}.sha256

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(git describe --tags --abbrev=0)"
          NAME="treehouse-${TAG#v}"
          # download-artifact v4 nests each artifact in release-artifacts/<artifact-name>/
          # Collect versioned release assets + their sha256 sidecars. Use the
          # REAL paths from find (do NOT reconstruct them — the intermediate
          # artifact dir would be dropped and gh would fail on a missing file).
          FILES=""
          while IFS= read -r -d '' f; do
            case "$f" in
              *treehouse-*.tar.gz|*treehouse-*.sha256|*treehouse-*.zip) ;;
              *) continue ;;
            esac
            FILES="$FILES $f"
          done < <(find release-artifacts -type f -name 'treehouse-*' -print0 | sort -z)
          FILES=$(printf '%s\n' $FILES | sort -u | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "No artifacts found — listing:"
            find release-artifacts -type f | head -20
            exit 1
          fi
          echo "Attaching:$FILES"
          gh release create "$TAG" $FILES --generate-notes --title "$TAG"
          echo "Released $TAG"
