[workspace]
resolver = "3"
members = ["crates/treehouse", "crates/treehouse-core"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["qdang46"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.151" }
thiserror = "2.0.20"
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
fd-lock = "4.0.4"
tempfile = "3.27.0"
sysinfo = "0.39.6"
toml = { version = "1.1.4", features = ["serde", "parse"] }
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
rand = "0.9"
humantime = "2.1.0"
sha2 = "0.10"
# Release-asset pipeline behind `treehouse update` (crates/treehouse-core/src/updater.rs):
# gzip + tar for the unix assets the release workflow builds, zip for the Windows
# asset. Both are declared with default features OFF — the workflow produces
# plain DEFLATE tar.gz / zip, and the default feature sets drag in xattr (tar)
# and aes-crypto/zstd/xz/lzma/bzip2/ppmd (zip) that we never call. `zip` is NOT
# target-gated to Windows: gating it would leave the extraction path unbuildable
# and therefore untested on the Linux/macOS CI that actually runs the suite.
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# TOON encoder (toon_rust). Package name is `tru` (v0.2.2), lib name `toon` —
# imports use `use toon::...`. MSRV 1.88, edition 2024, license MIT +
# OpenAI/Anthropic Rider (NOT plain MIT — see docs/rust-port-plan.md §3/§5.4).
# Pinned to an immutable rev so a force-push on upstream can't break us.
tru = { git = "https://github.com/Dicklesworthstone/toon_rust", rev = "cb256dcf73ab78c248a14f65840a3fa722ec8682" }
# Raw Darwin syscalls for APFS clonefile sharing (crates/treehouse-core/src/fileclone/mod.rs):
# fclonefileat, the getattrlist xattr/ACL readers, and the openat(O_NOFOLLOW) walk
# that pins directory descriptors. Already in the lockfile as a transitive dependency
# of tempfile/nix; declared here so treehouse-core can name it directly instead of
# reimplementing the wrappers. Target-gated to macOS at the member — the module's
# non-macOS build is a no-op and must not pull a Unix syscall surface into it.
libc = "0.2.189"
