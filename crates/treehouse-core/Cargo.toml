[package]
name = "treehouse-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Pure library port of Treehouse: pool/state/lease/owner/process/git/hooks/config"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
fd-lock = { workspace = true }
tempfile = { workspace = true }
sysinfo = { workspace = true }
toml = { workspace = true }
owo-colors = { workspace = true }
rand = { workspace = true }
humantime = { workspace = true }
sha2 = { workspace = true }
# The `tru` package (Dicklesworthstone/toon_rust, lib name `toon`) is the TOON
# encoder, verified + pinned by the toon-verify bead. It is optional (the `toon`
# feature) so a checkout without network access to toon_rust still compiles.
tru = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }

# The `toon` feature enables the TOON encoder (git dependency, off by default).
[features]
default = []
toon = ["dep:tru"]
# P1-A hardening race/concurrency tests (timing-sensitive).
hardening = []

[[example]]
name = "custom_env"
path = "examples/custom_env.rs"

[[example]]
name = "in_memory_env"
path = "examples/in_memory_env.rs"
