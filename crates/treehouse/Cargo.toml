[package]
name = "treehouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Treehouse CLI — a pool of reusable git worktrees for coding agents (Rust port)"

[[bin]]
name = "treehouse"
path = "src/main.rs"

[features]
default = []
# Enable the TOON encoder (git dep, off by default so offline builds work).
toon = ["treehouse-core/toon", "dep:tru"]

[dependencies]
treehouse-core = { path = "../treehouse-core" }
clap = { version = "4.6.6", features = ["derive"] }
anyhow = { workspace = true }
owo-colors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
humantime = { workspace = true }
# The TOON encoder (toon_rust); optional behind the `toon` feature.
tru = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
