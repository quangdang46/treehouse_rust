[package]
name = "treehouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Treehouse CLI — a pool of reusable git worktrees for coding agents (Rust port)"

[[bin]]
name = "treehouse"
path = "src/main.rs"

[features]
default = []
# The TOON encoder (git dep, off by default so offline builds work).
#
# OFF BY DEFAULT but REQUIRED IN SHIPPED BUILDS. `format.rs:render_toon` and
# `main.rs:render_payload` fall back to serde_json without it, so a default
# build answers `--format toon` with JSON — which is what the README and the
# release notes promise against. `.github/workflows/release.yml` therefore
# passes `--features toon` to both `cross build` and `cargo build`.
#
# Do NOT "fix" this by promoting it to `default`: that makes every contributor's
# `cargo build` require a clone of Dicklesworthstone/toon_rust, and the pinned
# git rev turns a cold checkout into a network dependency for the whole
# workspace — including `cargo test --workspace`. The release build asks for the
# feature explicitly instead, and the README's `cargo install` line does too.
toon = ["treehouse-core/toon", "dep:tru"]

[dependencies]
treehouse-core = { path = "../treehouse-core" }
clap = { version = "4.6.6", features = ["derive"] }
anyhow = { workspace = true }
owo-colors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
humantime = { workspace = true }
ctrlc = { version = "3", features = ["termination"] }
# The TOON encoder (toon_rust); optional behind the `toon` feature.
tru = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
